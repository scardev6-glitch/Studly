<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner | Studly</title>
    <link rel="stylesheet" href="css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <header style="margin-bottom: 24px;">
            <h1>Study Planner</h1>
            <p>Optimize your time for maximum mastery.</p>
        </header>

        <main>
            <div id="plan-input" class="card">
                <h3 style="margin-bottom: 12px; font-size: 16px;">How much time do you have?</h3>
                <div style="display: flex; gap: 12px; margin-bottom: 16px;">
                    <button class="btn-time card" onclick="setTime(30)" style="flex: 1; padding: 12px; margin: 0;">30m</button>
                    <button class="btn-time card" onclick="setTime(60)" style="flex: 1; padding: 12px; margin: 0;">1h</button>
                    <button class="btn-time card" onclick="setTime(120)" style="flex: 1; padding: 12px; margin: 0;">2h</button>
                </div>
                <button id="generate-plan" class="btn-primary">
                    <i data-lucide="zap" size="18"></i> Generate Smart Plan
                </button>
            </div>

            <div id="today-plan" style="display: none;">
                <h2 style="margin-bottom: 16px;">Today's Schedule</h2>
                <div id="plan-items">
                    <!-- Plan items will be loaded here -->
                </div>
            </div>

            <div id="no-plan" style="text-align: center; margin-top: 40px;">
                <i data-lucide="calendar-x" size="48" color="#CBD5E1"></i>
                <p style="margin-top: 12px;">No plan generated for today yet.</p>
            </div>
        </main>

        <nav class="bottom-nav">
            <a href="/dashboard" class="nav-item">
                <i data-lucide="home" size="24"></i>
                <span>Home</span>
            </a>
            <a href="/study" class="nav-item">
                <i data-lucide="book-open" size="24"></i>
                <span>Study</span>
            </a>
            <a href="/notes" class="nav-item">
                <i data-lucide="edit-3" size="24"></i>
                <span>Notes</span>
            </a>
            <a href="/planner" class="nav-item active">
                <i data-lucide="calendar" size="24"></i>
                <span>Planner</span>
            </a>
        </nav>
    </div>

    <script src="utils.js"></script>
    <script>
        let selectedTime = 60;

        function setTime(mins) {
            selectedTime = mins;
            document.querySelectorAll('.btn-time').forEach(b => b.style.borderColor = 'var(--border)');
            event.target.style.borderColor = 'var(--primary)';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const auth = utils.checkAuth();
            if (!auth) return;

            const planItems = document.getElementById('plan-items');
            const todayPlan = document.getElementById('today-plan');
            const noPlan = document.getElementById('no-plan');
            const genBtn = document.getElementById('generate-plan');

            const loadPlan = async () => {
                const plan = await utils.fetchAPI('/planner/today');
                if (plan && !plan.message) {
                    todayPlan.style.display = 'block';
                    noPlan.style.display = 'none';
                    planItems.innerHTML = '';
                    
                    plan.dailyGoals.forEach(goal => {
                        const item = document.createElement('div');
                        item.className = 'card';
                        item.style.display = 'flex';
                        item.style.alignItems = 'center';
                        item.style.gap = '16px';
                        item.innerHTML = `
                            <div style="width: 40px; height: 40px; border-radius: 12px; background: var(--bg-blue); display: flex; justify-content: center; align-items: center;">
                                <i data-lucide="book" size="20" color="var(--primary)"></i>
                            </div>
                            <div style="flex: 1;">
                                <div style="font-weight: 700; font-size: 14px;">${goal.subject}</div>
                                <div style="font-size: 12px; color: var(--text-muted);">${goal.duration} mins • ${goal.status}</div>
                            </div>
                            <i data-lucide="chevron-right" size="18" style="color: #CBD5E1;"></i>
                        `;
                        planItems.appendChild(item);
                    });
                    utils.initIcons();
                } else {
                    todayPlan.style.display = 'none';
                    noPlan.style.display = 'block';
                }
            };

            loadPlan();

            genBtn.addEventListener('click', async () => {
                genBtn.disabled = true;
                genBtn.innerHTML = 'Optimizing...';
                
                await utils.fetchAPI('/planner/generate', {
                    method: 'POST',
                    body: JSON.stringify({ availableTime: selectedTime })
                });

                genBtn.disabled = false;
                genBtn.innerHTML = '<i data-lucide="zap" size="18"></i> Generate Smart Plan';
                loadPlan();
            });
        });
    </script>
</body>
</html>
