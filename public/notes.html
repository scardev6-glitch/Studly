<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Notes | Studly</title>
    <link rel="stylesheet" href="css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .note-editor { margin-bottom: 24px; }
        textarea { width: 100%; height: 120px; padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--border); font-family: inherit; margin-bottom: 12px; resize: none; }
        .note-card h3 { font-size: 16px; margin-bottom: 8px; }
        .ai-summary { background: var(--bg-blue); padding: 12px; border-radius: var(--radius-md); font-size: 13px; color: var(--primary); margin-top: 8px; border-left: 4px solid var(--primary); }
    </style>
</head>
<body>
    <div class="app-container">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <h1>Smart Notes</h1>
            <div id="user-points" style="font-size: 14px; font-weight: 700; color: var(--accent-orange);">
                <i data-lucide="zap" size="16" fill="currentColor"></i> 0 pts
            </div>
        </header>

        <main>
            <div class="note-editor">
                <select id="topic-select" class="card" style="width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid var(--border); border-radius: var(--radius-md);">
                    <option value="">Select Topic...</option>
                </select>
                <textarea id="note-content" placeholder="Type your notes here... AI will summarize them automatically!"></textarea>
                <button id="save-note" class="btn-primary">
                    <i data-lucide="sparkles" size="18"></i> Save with AI Summary
                </button>
            </div>

            <div id="notes-list">
                <!-- Notes will be loaded here -->
            </div>
        </main>

        <nav class="bottom-nav">
            <a href="/dashboard" class="nav-item">
                <i data-lucide="home" size="24"></i>
                <span>Home</span>
            </a>
            <a href="/study" class="nav-item">
                <i data-lucide="book-open" size="24"></i>
                <span>Study</span>
            </a>
            <a href="/notes" class="nav-item active">
                <i data-lucide="edit-3" size="24"></i>
                <span>Notes</span>
            </a>
            <a href="/planner" class="nav-item">
                <i data-lucide="calendar" size="24"></i>
                <span>Planner</span>
            </a>
        </nav>
    </div>

    <script src="utils.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const auth = utils.checkAuth();
            if (!auth) return;

            const notesList = document.getElementById('notes-list');
            const topicSelect = document.getElementById('topic-select');
            const saveBtn = document.getElementById('save-note');

            // 1. Load Topics for dropdown
            const topics = await utils.fetchAPI('/study/topics');
            if (topics) {
                topics.forEach(t => {
                    const opt = document.createElement('option');
                    opt.value = t._id;
                    opt.textContent = `${t.subject}: ${t.name}`;
                    topicSelect.appendChild(opt);
                });
            }

            // 2. Load Existing Notes
            const loadNotes = async () => {
                notesList.innerHTML = '<p>Loading notes...</p>';
                const notes = await utils.fetchAPI('/notes');
                notesList.innerHTML = '';
                if (notes && notes.length > 0) {
                    notes.forEach(note => {
                        const card = document.createElement('div');
                        card.className = 'card note-card';
                        card.innerHTML = `
                            <div style="display: flex; justify-content: space-between;">
                                <span style="font-size: 12px; font-weight: 700; color: var(--text-muted);">${note.topicId?.name || 'General'}</span>
                                <span style="font-size: 11px; color: var(--text-muted);">${new Date(note.createdAt).toLocaleDateString()}</span>
                            </div>
                            <p style="margin: 8px 0; color: var(--text-main);">${note.content}</p>
                            <div class="ai-summary">
                                <strong>AI Summary:</strong><br>${note.summary}
                            </div>
                        `;
                        notesList.appendChild(card);
                    });
                } else {
                    notesList.innerHTML = '<p style="text-align: center; color: var(--text-muted);">No notes yet. Start typing above!</p>';
                }
                utils.initIcons();
            };

            loadNotes();

            // 3. Save Note
            saveBtn.addEventListener('click', async () => {
                const topicId = topicSelect.value;
                const content = document.getElementById('note-content').value;

                if (!topicId || !content) return alert('Please select a topic and enter content');

                saveBtn.disabled = true;
                saveBtn.innerHTML = 'Summarizing...';

                await utils.fetchAPI('/notes', {
                    method: 'POST',
                    body: JSON.stringify({ topicId, content })
                });

                document.getElementById('note-content').value = '';
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i data-lucide="sparkles" size="18"></i> Save with AI Summary';
                loadNotes();
            });
        });
    </script>
</body>
</html>
